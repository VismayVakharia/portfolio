name: Refresh hobby data

on:
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC
  workflow_dispatch: # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit updated data via the GitHub API

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch hobby data
        run: npm run fetch-data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          JELU_URL: ${{ secrets.JELU_URL }}
          JELU_TOKEN: ${{ secrets.JELU_TOKEN }}

      - name: Commit updated data via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const files = [
              "src/data/steam-games.json",
              "src/data/psn-games.json",
              "src/data/jelu-books.json",
            ];

            for (const filePath of files) {
              const content = fs.readFileSync(filePath, "utf8");

              let sha;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: "main",
                });
                sha = data.sha;
                const existing = Buffer.from(data.content, "base64").toString("utf8");
                if (existing === content) {
                  console.log(`[skip] ${filePath} unchanged`);
                  continue;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: "chore: refresh hobby data",
                content: Buffer.from(content).toString("base64"),
                sha,
                branch: "main",
              });
              console.log(`[commit] ${filePath} updated`);
            }
